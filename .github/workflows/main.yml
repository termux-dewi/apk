name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract ZIP File
      run: |
        # Cari file .zip yang ada di root repository
        ZIP_FILE=$(ls *.zip | head -n 1)
        echo "Mengekstrak $ZIP_FILE..."
        unzip -q "$ZIP_FILE" -d temp_extracted

        # Pindahkan file jika di dalam ZIP terdapat folder utama
        if [ $(ls -1 temp_extracted | wc -l) -eq 1 ] && [ -d temp_extracted/* ]; then
          cp -rn temp_extracted/*/* .
        else
          cp -rn temp_extracted/* .
        fi
        rm -rf temp_extracted

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
